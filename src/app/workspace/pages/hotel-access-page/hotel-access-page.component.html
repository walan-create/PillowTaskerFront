<div
  class="d-flex flex-column align-items-center justify-content-center bg-white h-100 rounded-3 py-4"
>
  <h2 class="fw-bold mb-4">Acceso a Hotel</h2>

  <p class="text-center mb-4">
    Para acceder a <strong>{{ hotelResource.value()?.name }}</strong
    >, ingrese la contraseña:
  </p>

  <form
    class="w-100 px-3"
    style="max-width: 30rem"
    [formGroup]="accessForm"
    (ngSubmit)="onAccessSubmit()"
  >
    <!-- Contraseña -->
    <div class="mb-3">
      <label for="password" class="form-label fw-bold"
        >Contraseña de su Credencial</label
      >

      <div class="input-group">
        <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        class="form-control custom-input bg-beige"
        formControlName="password"
        placeholder="Ingrese la contraseña"
        autocomplete="new-password"
        required
        [class.is-invalid]="
          accessForm.get('password')?.invalid &&
          accessForm.get('password')?.touched
        "
      />
      <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="togglePasswordVisibility()"
        >
          <i
            class="bi"
            [ngClass]="
              showPassword
                ? 'fa-solid fa-eye'
                : 'fa-solid fa-eye-slash'
            "
          ></i>
        </button>
      </div>

      <form-error-label [control]="accessForm.get('password')!"></form-error-label>

    </div>

    <!-- Botón de Acceder -->
    <button
      type="submit"
      class="btn btn-secondary w-100"
      [disabled]="accessForm.invalid"
    >
      Acceder
    </button>
  </form>

  <a routerLink="/workspace/hotels" class="text-sm text-primary mt-3 small"
    >Volver a la lista de hoteles</a
  >

  @if (accessSuccess()) {
  <div
    class="alert alert-success mx-3 position-fixed my-4 py-4 shadow"
    role="alert"
  >
    <span>Acceso concedido correctamente</span>
  </div>
  }
  @if (hasError()){
    <div
    class="alert alert-danger mx-3 position-fixed my-4 py-4 shadow"
    role="alert"
  >
    <span>Acceso Negado</span>
  </div>
  }
  
</div>
