<div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered text-primary">
    <div class="modal-content ">

      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="passwordModalLabel">
          Contraseña de su nueva Credencial
        </h5>
        <button
          type="button"
          class="d-flex justify-content-center bg-secondary ms-auto rounded-circle border-0 px-1"
          data-bs-dismiss="modal"
          aria-label="Close"
        >
          <i class="text-white fa-solid fa-xmark fs-4"></i>
        </button>
      </div>

      <div class="modal-body">
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <div class="input-group">
              <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              class="form-control custom-input bg-beige"
              formControlName="password"
              placeholder="Ingrese la contraseña"
              autocomplete="new-password"
              [class.is-invalid]="
                passwordForm.get('password')?.invalid &&
                passwordForm.get('password')?.touched
              "
              required
            />
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="togglePasswordVisibility()"
              >
                <i class="bi" [ngClass]="showPassword ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'"></i>
              </button>
            </div>

            <form-error-label
              [control]="passwordForm.get('password')!"
            ></form-error-label>
          </div>
          <button
            type="submit"
            class="btn btn-secondary w-100"
            [disabled]="passwordForm.invalid"
            data-bs-dismiss="modal"
          >
            Enviar
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
