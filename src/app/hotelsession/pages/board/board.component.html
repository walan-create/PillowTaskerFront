<h2 class="text-primary">Reservas</h2>
<hr class="mt-0 mb-3 border-4 border-primary border-1 opacity-50">

@if (board()) {
  <div class="m-0 row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 row-cols-xxl-6 g-3">
    <board-item
      title="Clientes Hotel"
      [number]="board().board()?.totalClients"
      link="/hotelsession/reservations"
    ></board-item>
    <board-item
      title="Entradas Hoy"
      [number]="board().board()?.checkInsToday"
      link="/hotelsession/reservations"
    ></board-item>
    <board-item
      title="Entr. pendientes"
      [number]="board().board()?.checkInsPendingToday"
      link="/hotelsession/reservations"
    ></board-item>
    <board-item
      title="Entr. Realizadas"
      [number]="board().board()?.checkInsDone"
      link="/hotelsession/reservations"
    ></board-item>
  </div>

  <h2 class="mt-3 text-primary">Estado Habitaciones</h2>
  <hr class="mt-0 mb-3 border-4 border-primary border-1 opacity-50">

  <div class="m-0 row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 row-cols-xxl-6 g-3">
    <board-item
      title="Total"
      [number]="board().board()?.totalRooms"
      link="/hotelsession/rooms"
    ></board-item>
    <board-item
      title="Disponibles"
      [number]="board().board()?.availableRooms"
      link="/hotelsession/rooms"
    ></board-item>
    <board-item
      title="Ocupadas"
      [number]="board().board()?.occupiedRooms"
      link="/hotelsession/rooms"
    ></board-item>
    <board-item
      title="Hab. Limpias"
      [number]="board().board()?.cleanRooms"
      link="/hotelsession/rooms"
    ></board-item>
    <board-item
      title="Hab. Sucias"
      [number]="board().board()?.dirtyRooms"
      link="/hotelsession/rooms"
    ></board-item>
    <board-item
      title="Mantenimiento"
      [number]="board().board()?.roomsUnderMaintenance"
      link="/hotelsession/rooms"
    ></board-item>
  </div>
} @else {
  <div class="text-center bg-black">
    <div class="spinner-border text-secondary" style="width: 3rem; height: 3rem;" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
}
