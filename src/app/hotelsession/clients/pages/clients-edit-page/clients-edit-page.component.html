<div class="d-flex flex-column align-items-center justify-content-center bg-white rounded-3 py-4" style="min-height: 100%;">
  <h2 class="fw-bold mb-4">Editar Cliente</h2>

  <form class="w-100 px-3" style="max-width: 30rem;" [formGroup]="clientForm" (ngSubmit)="onSubmit()">

    <div class="row mb-2">
      <div class="col-6">
        <label class="form-label fw-bold">NIF</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: 12345678A"
          formControlName="nif"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('nif')?.invalid && clientForm.get('nif')?.touched"
        />
        <form-error-label [control]="clientForm.get('nif')!"></form-error-label>
      </div>
      <div class="col-6">
        <label class="form-label fw-bold">Teléfono</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: +34600111222"
          formControlName="phoneNumber"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('phoneNumber')?.invalid && clientForm.get('phoneNumber')?.touched"
        />
        <form-error-label [control]="clientForm.get('phoneNumber')!"></form-error-label>
      </div>
    </div>

    <div class="row mb-2">
      <div class="col-6">
        <label class="form-label fw-bold">Nombre</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: Juan"
          formControlName="name"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('name')?.invalid && clientForm.get('name')?.touched"
        />
        <form-error-label [control]="clientForm.get('name')!"></form-error-label>
      </div>
      <div class="col-6">
        <label class="form-label fw-bold">Primer Apellido</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: Pérez"
          formControlName="surname1"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('surname1')?.invalid && clientForm.get('surname1')?.touched"
        />
        <form-error-label [control]="clientForm.get('surname1')!"></form-error-label>
      </div>
    </div>

    <div class="row mb-2">
      <div class="col-6">
        <label class="form-label fw-bold">Segundo Apellido</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: García"
          formControlName="surname2"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('surname2')?.invalid && clientForm.get('surname2')?.touched"
        />
        <form-error-label [control]="clientForm.get('surname2')!"></form-error-label>
      </div>
      <div class="col-6">
        <label class="form-label fw-bold">Fecha de Nacimiento</label>
         <input
          type="date"
          class="form-control custom-input bg-beige"
          formControlName="birthDate"
          required
          [max]="today"
          [class.is-invalid]="
            clientForm.get('birthDate')?.invalid &&
            clientForm.get('birthDate')?.touched
          "
        />
        <form-error-label [control]="clientForm.get('birthDate')!"></form-error-label>
      </div>
    </div>

    <div class="row mb-2">
      <div class="col-6">
        <label class="form-label fw-bold">Nacionalidad</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: Española"
          formControlName="nationality"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('nationality')?.invalid && clientForm.get('nationality')?.touched"
        />
        <form-error-label [control]="clientForm.get('nationality')!"></form-error-label>
      </div>
      <div class="col-6">
        <label class="form-label fw-bold">Dirección</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: Calle Falsa 123"
          formControlName="address"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('address')?.invalid && clientForm.get('address')?.touched"
        />
        <form-error-label [control]="clientForm.get('address')!"></form-error-label>
      </div>
    </div>

    <div class="row mb-2">
      <div class="col-12">
        <label class="form-label fw-bold">Código Postal</label>
        <input
          type="text"
          class="form-control custom-input bg-beige"
          placeholder="Ej: 29001"
          formControlName="postalCode"
          autocomplete="off"
          required
          [class.is-invalid]="clientForm.get('postalCode')?.invalid && clientForm.get('postalCode')?.touched"
        />
        <form-error-label [control]="clientForm.get('postalCode')!"></form-error-label>
      </div>
    </div>

    <button type="submit" class="btn btn-secondary w-100">Guardar</button>
  </form>

  <a routerLink="/hotelsession/clients" class="text-sm text-primary mt-3 small">Volver a la lista de clientes</a>

  @if (wasSaved()) {
    <div class="alert alert-success mx-3 position-fixed my-4 py-4 shadow" role="alert" >
      <span>Datos Actualizados Correctamente</span>
    </div>
  }
</div>
