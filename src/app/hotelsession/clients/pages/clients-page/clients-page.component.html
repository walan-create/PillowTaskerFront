<h2 class="text-primary">Clientes</h2>
<hr class="mt-0 mb-3 border-4 border-primary border-1 opacity-50" />

<list-toolbar
  [searchText]="searchText"
  [orderBy]="orderBy"
  [orderDirection]="orderDirection"
  [orderFields]="[
    { key: 'name', label: 'Nombre' },
    { key: 'surname1', label: 'Apellido 1' },
    { key: 'surname2', label: 'Apellido 2' },
    { key: 'nif', label: 'NIF' },
    { key: 'birthDate', label: 'Nacimiento' },
    { key: 'nationality', label: 'Nacionalidad' },
    { key: 'phoneNumber', label: 'Teléfono' }
  ]"
  [searchPlaceholder]="'Buscar cliente...'"
  [createButtonLink]="'/hotelsession/clients/create'"
  [createButtonText]="'Crear'"
  (searchTextChange)="onSearchTextChange($event)"
  (orderByChange)="onOrderByChange($event)"
  (orderDirectionChange)="onOrderDirectionChange($event)"
/>

@if(isMobileOrTablet()) { @defer{

<app-list
  [data]="clients()"
  [columns]="clientColumns"
  [orderBy]="orderBy"
  [orderDirection]="orderDirection"
  [searchText]="searchText"
  [actionsTemplate]="actionsTemplate"
>
  <ng-template #actionsTemplate let-client>
    <button
      [routerLink]="['/hotelsession/clients/', client.id]"
      class="btn btn-warning d-flex align-items-center justify-content-center"
      style="width: 30px; height: 30px"
      title="Editar"
    >
      <i class="fa-solid fa-pencil fs-5 text-white"></i>
    </button>
    <button
      (click)="openDeleteClientModal(client.id)"
      class="btn btn-danger d-flex align-items-center justify-content-center"
      style="width: 30px; height: 30px"
    >
      <i class="fa-solid fa-trash-can fs-5"></i>
    </button>
  </ng-template>
</app-list>

} } @else { @defer{

<div class="flex-grow-1 overflow-auto">
  <app-table
    [data]="clients()"
    [columns]="clientColumns"
    [orderBy]="orderBy"
    [orderDirection]="orderDirection"
    [searchText]="searchText"
    [actionsTemplate]="actionsTemplate"
  >
    <ng-template #actionsTemplate let-client>
      <button
        [routerLink]="['/hotelsession/clients/', client.id]"
        class="btn btn-warning d-flex align-items-center justify-content-center"
        style="width: 30px; height: 30px"
      >
        <i class="fa-solid fa-pencil fs-5 text-white"></i>
      </button>
      <button
        (click)="openDeleteClientModal(client.id)"
        class="btn btn-danger d-flex align-items-center justify-content-center"
        style="width: 30px; height: 30px"
      >
        <i class="fa-solid fa-trash-can fs-5"></i>
      </button>
    </ng-template>
  </app-table>
</div>

} } @if (globalError()) {
<div
  class="alert alert-danger position-fixed top-50 start-50 translate-middle shadow py-4"
  style="z-index: 2000; min-width: 320px; max-width: 90vw; text-align: center"
  role="alert"
>
  {{ globalError() }}
</div>
}

<reusable-modal
  [id]="'reusableModal'"
  [modalText]="'¿Deseas eliminar el cliente de forma permanente?'"
  (accepted)="handleDeleteClient()"
></reusable-modal>
