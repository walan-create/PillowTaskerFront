<header class="d-grid" style="height: 90px;">
  <nav class="navbar navbar-light sticky-top bg-white shadow">
    <div class="container-xxl">

      <!-- Botón desplegable (Visible en Móvil) -->
      <button class="navbar-toggler d-block text-white border-0 fs-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Logo -->
      <div class="navbar-brand me-auto ms-3">
        <a [routerLink]="'/landing'" class="d-flex align-items-center no-decoration" href="#">
          <img src="assets/images/almohada-logo.png" alt="Bootstrap" width="60" height="40" class="me-2">
          <h3 class="logo-text mb-0 ">PillowTasker</h3>
        </a>
      </div>

      <!-- Informacion Usuario -->
      <div class="align-items-end d-none d-sm-flex flex-column text-primary">
        <small class="mb-0">Hotel</small>
        <small class="mb-0">Nombre Empleado</small>
        <small class="mb-0">Recepción</small>
      </div>

      <!-- Contenido del Desplegable -->
      <div class="offcanvas offcanvas-start text-bg-primary" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel" style="width: 330px;">

        <!-- Encabezado del Desplegable -->
        <div class="offcanvas-header align-items-center px-4" style="height: 90px;">
          <a class="d-flex align-items-center no-decoration" href="#">
            <h3 class="logo-text text-bg-primary">PillowTasker</h3>
          </a>
          <button type="button" class="text-white border-0 bg-transparent ms-auto" data-bs-dismiss="offcanvas" aria-label="Close">
            <i class="fa-solid fa-circle-chevron-left fs-1"></i>
          </button>
        </div>

        <!-- Línea horizontal -->
         <hr class="my-0 border border-white border-1 opacity-50">

        <!-- Cuerpo del desplegable -->
        <div class="offcanvas-body px-4 d-flex flex-column">
          <div class="list-unstyled" id="list-tab" role="tablist">

            <a [routerLink]="'/hotelsession/board'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2">
              <i class="fa-solid fa-clipboard-list fs-2 m-0 ms-2" style="width: 32px;"></i>
              <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">Tablero</h5>
            </a>

            <a [routerLink]="'/hotelsession/employees'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2">
              <i class="fa-solid fa-user-gear fs-2 m-0 ms-2" style="width: 32px;"></i>
              <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">Empleados</h5>
            </a>

            <a [routerLink]="'/hotelsession/rooms'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2">
              <i class="fa-solid fa-bed fs-2 m-0 ms-2" style="width: 32px;"></i>
              <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">Habitaciones</h5>
            </a>

            <a [routerLink]="'/hotelsession/clients'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2">
              <i class="fa-solid fa-users-gear fs-2 m-0 ms-2" style="width: 32px;"></i>
              <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">Clientes</h5>
            </a>

            <a [routerLink]="'/hotelsession/services'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2">
              <i class="fa-solid fa-hands-bubbles fs-2 m-0 ms-2" style="width: 32px;"></i>
              <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">Servicios</h5>
            </a>

            <a [routerLink]="'/hotelsession/incidents'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2">
              <i class="fa-solid fa-triangle-exclamation fs-2 m-0 ms-2" style="width: 32px;"></i>
              <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">Incidencias</h5>
            </a>

            <a [routerLink]="'/hotelsession/reservations'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2">
              <i class="fa-solid fa-bell-concierge fs-2 m-0 ms-2" style="width: 32px;"></i>
              <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">reservas</h5>
            </a>
          </div>

          <a [routerLink]="'/workspace'" routerLinkActive="btn-light-brown text-primary" class="btn btn-lg btn-primary w-100 d-flex mb-2 mt-auto">
            <i class="fa-solid fa-door-open fs-2 m-0 ms-2" style="width: 32px;"></i>
            <h5 class="my-0 mx-4 align-items-center justify-content-center d-flex">Salir Sesión Hotel</h5>
          </a>
        </div>

      </div>

    </div>
  </nav>
</header>
