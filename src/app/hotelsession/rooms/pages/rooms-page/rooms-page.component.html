  <!-- Título -->
  <h2 class="text-primary">Habitaciones</h2>
  <hr class="mt-0 mb-3 border-4 border-primary border-1 opacity-50" />

  <!-- Toolbar -->
  <list-toolbar
    [searchText]="searchText"
    [orderBy]="orderBy"
    [orderDirection]="orderDirection"
    [orderFields]="[
      { key: 'numberRoom', label: 'Número' },
      { key: 'capacity', label: 'Capacidad' },
      { key: 'type', label: 'Tipo' },
      { key: 'state', label: 'Estado' },
      { key: 'kitchen', label: 'Cocina' }
    ]"
    [searchPlaceholder]="'Buscar habitación...'"
    [createButtonLink]="'/hotelsession/rooms/create'"
    [createButtonText]="'Crear'"
    (searchTextChange)="onSearchTextChange($event)"
    (orderByChange)="onOrderByChange($event)"
    (orderDirectionChange)="onOrderDirectionChange($event)"
  />

  <!-- Contenedor scrollable para la tabla -->
  <div class="flex-grow-1 overflow-auto">
    <app-table
      [data]="rooms()"
      [columns]="roomColumns"
      [orderBy]="orderBy"
      [orderDirection]="orderDirection"
      [searchText]="searchText"
      [actionsTemplate]="actionsTemplate"
    >
      <ng-template #actionsTemplate let-room>
        <button
          [routerLink]="['/hotelsession/rooms/', room.id]"
          class="btn btn-warning d-flex align-items-center justify-content-center"
          style="width: 30px; height: 30px"
        >
          <i class="fa-solid fa-pencil fs-5 text-white"></i>
        </button>
        <button
          (click)="openDeleteRoomModal(room.id)"
          class="btn btn-danger d-flex align-items-center justify-content-center"
          style="width: 30px; height: 30px"
        >
          <i class="fa-solid fa-trash-can fs-5"></i>
        </button>
      </ng-template>
    </app-table>
  </div>

  <!-- Modal -->
  <reusable-modal
    [modalText]="'¿Deseas eliminar el empleado de forma permanente?'"
    (accepted)="handleDeleteRoom()"
  ></reusable-modal>
