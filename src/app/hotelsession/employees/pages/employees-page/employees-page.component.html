<h2 class="text-primary">Empleados</h2>
<hr class="mt-0 mb-3 border-4 border-primary border-1 opacity-50" />

<!-- Aqui va la cabecera de la tabla con los botones -->
<div class="bg-white rounded-3 d-inline-block mb-3">
  <div class="d-flex px-1">

    <div class="p-2">
      <button
        [routerLink]="'/workspace/hotels/create'"
        class="btn btn-green d-flex align-items-center justify-content-center"
        style="height: 40px"
      >
        <i class="fa-solid fa-plus fs-4"></i>
        <h5 class="m-0 ms-2">Crear Hotel</h5>
      </button>
    </div>

  </div>
</div>

<!-- Aqui va la tabla -->
@if(isMobileOrTablet()) { @defer{
<!-- <employees-list [credentials]="credentials()" /> -->
<employees-table [credentials]="credentials()" />
} } @else { @defer{
<employees-table [credentials]="credentials()" />
} }
