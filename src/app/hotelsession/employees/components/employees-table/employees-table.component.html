<table class="table table-hover table-bordered table-striped">
  <thead>
    <tr class="text-align-center">
      <th class="text-primary bg-veige border border-secondary col-2">Nombre</th>
      <th class="text-primary bg-veige border border-secondary col-2">Apellido 1</th>
      <th class="text-primary bg-veige border border-secondary col-1">Apellido 2</th>
      <th class="text-primary bg-veige border border-secondary col-1">DNI</th>
      <th class="text-primary bg-veige border border-secondary col-1">Cargo</th>
      <th class="text-primary bg-veige border border-secondary col-1">Acciones</th>
    </tr>
  </thead>
  <tbody>
    @if (credentials()) {
      @for (credential of credentials(); track credential) {
        <tr>
          <td>{{ credential.name }}</td>
          <td>{{ credential.surname1 }}</td>
          <td>{{ credential.surname2 }}</td>
          <td>{{ credential.dni }}</td>
          <td>{{ credential.rol }}</td>
          <td>
            <div class="d-flex justify-content-center gap-1">
              <button
               class="btn btn-warning d-flex align-items-center justify-content-center"
               style="width: 30px; height: 30px"
              >
                <i class="fa-solid fa-pencil fs-5 text-white"></i>
              </button>
              <button
                (click)="openDeleteCredentialModal(credential.id)"
                class="btn btn-danger d-flex align-items-center justify-content-center"
                style="width: 30px; height: 30px"
              >
               <i class="fa-solid fa-trash-can fs-5"></i>
              </button>
            </div>
          </td>
        </tr>

    } }
  </tbody>

</table>
@if (credentials().length === 0) {
<div class="alert alert-warning text-center" role="alert">No hay Empleados!</div>
}

<reusable-modal
    [modalText]="'¿Deseas eliminar el empleado de forma permanente?'"
    (accepted)="handleDeleteCredential()"
></reusable-modal>
