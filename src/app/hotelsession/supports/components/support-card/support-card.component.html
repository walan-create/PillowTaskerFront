<div class="col">
  <div class="card text-primary p-3 card-body">
    @if (room().type === 'SUITE') {
    <img
      src="assets/images/suite-room.jpg"
      class="card-img-top mb-3 rounded-3"
      style="height: 150px; object-fit: cover"
    />
    } @if (room().type === 'STANDAR') {
    <img
      src="assets/images/standar-room.jpg"
      class="card-img-top mb-3 rounded-3"
      style="height: 150px; object-fit: cover"
    />
    } @if (room().type === 'ADAPTABLE') {
    <img
      src="assets/images/adaptable-room.jpg"
      class="card-img-top mb-3 rounded-3"
      style="height: 150px; object-fit: cover"
    />
    }

    <h5 class="card-title m-0 mb-1">{{ room().code }}</h5>
    <div class="d-flex justify-content-between align-items-center mb-2">

      <p class="card-text m-0 text-primary ">
        {{ room().type | roomType }}
      </p>

      <span
        class="rounded-2 text-white"
        [ngClass]="{
          'bg-success px-3': room().state === 'DIRTY',
          'bg-gray px-2': room().state === 'MAINTENANCE'
        }"
      >
        <small>
          <b>{{ room().state | roomState }}</b>
        </small>
      </span>

    </div>

    <div class="text-end">
      @if (room().state === 'DIRTY') {
      <button
        class="btn btn-secondary d-flex justify-content-center align-items-center w-100"
        type="button"
        (click)="onSolicitarConfirmacion()"
      >
        <i class="fa-solid fa-broom p-0 m-0 fs-5"></i>
        <p class="p-0 m-0 ms-3"><b>Marcar Limpia</b></p>
      </button>
      } @if (room().state === 'MAINTENANCE') {
      <button
        class="btn btn-secondary d-flex justify-content-center align-items-center w-100"
        type="button"
        (click)="onSolicitarConfirmacion()"
      >
        <i class="fa-solid fa-screwdriver-wrench p-0 m-0 fs-5"></i>
        <p class="p-0 m-0 ms-3"><b>Marcar Reparada</b></p>
      </button>
      }
    </div>
  </div>
</div>
