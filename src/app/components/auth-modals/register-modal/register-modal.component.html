<!-- Modal de Registro -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" data-bs-backdrop="static" aria-hidden="true">
   
  <div class="modal-dialog modal-dialog-centered text-primary">
    <div class="modal-content p-3">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Crea tu cuenta</h5>
        <button type="button" class="d-flex justify-content-center bg-secondary border-0 ms-auto rounded-5" data-bs-dismiss="modal" aria-label="Close">
          <i class="text-white fa-solid fa-xmark fs-2"></i>
        </button>
        
      </div>
      <div class="modal-body">
        <form (submit)="register()">
          <!-- Nombre -->
          <div class="mb-3">
            <label class="form-label fw-bold">Nombre</label>
            <input type="text" class="form-control custom-input bg-beige" placeholder="Introduce tu nuevo nombre de usuario" [(ngModel)]="name" name="name" required />
          </div>
          <!-- Correo -->
          <div class="mb-3">
            <label class="form-label fw-bold">Correo</label>
            <input type="email" class="form-control custom-input bg-beige" placeholder="Introduce tu correo electrónico" [(ngModel)]="email" name="email" required />
          </div>
          <!-- Contraseña -->
          <div class="mb-3">
            <label class="form-label fw-bold">Contraseña</label>
            <div class="input-group">
              <input [type]="showPassword ? 'text' : 'password'" class="form-control custom-input bg-beige" placeholder="Introduce una contraseña segura" [(ngModel)]="password" name="password" required />
              <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()">
                <i class="bi" [ngClass]="showPassword ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'"></i>
              </button>
            </div>
          </div>
          <!-- Confirmar Contraseña -->
          <div class="mb-3">
            <div class="input-group">
              <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control custom-input bg-beige" placeholder="Repite la contraseña" [(ngModel)]="confirmPassword" name="confirmPassword" required />
              <button type="button" class="btn btn-outline-secondary" (click)="toggleConfirmPasswordVisibility()">
                <i class="bi" [ngClass]="showConfirmPassword ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'"></i>
              </button>
            </div>
          </div>
          <!-- Checkbox -->
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="privacyPolicy" [(ngModel)]="acceptPolicy" name="acceptPolicy" required />
            <label class="form-check-label" for="privacyPolicy">Acepto la política de privacidad</label>
          </div>
          <!-- Botón de Registro -->
          <button type="submit" class="btn btn-secondary w-100 custom-button">Crear</button>
        </form>
      </div>
    </div>
  </div>

</div>
