<main class="bg-room d-flex py-3 px-2" style="min-height: calc(100vh - 90px);">
    <div class="container-xxl rounded-3 p-3" style="background-color: rgba(255, 255, 255, 0.7);">

        <h2 class="text-primary">Incidencias</h2>
        <hr class="mt-0 mb-3 border-4 border-primary border-1 opacity-50">

        <!-- Aqui va la cabecera de la tabla con los botones -->
        <div class="bg-white rounded-3 d-inline-block mb-3">
            <div class="d-flex px-1">
                <div class="p-2">
                    <button class="btn btn-success d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="fa-solid fa-plus fs-4"></i>
                    </button>
                </div>
                <div class="vr my-3 mx-2 bg-primary opacity-100 rounded" style="width: 2px;"></div>
                <div class="p-2">
                    <button class="btn btn-secondary d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="fa-solid fa-magnifying-glass fs-4"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- Aqui va la tabla -->
        @if(isMobileOrTablet()) {
            @defer{
                <app-list></app-list>
            }
        } @else {
            @defer{
                <app-table></app-table>
            }
        }

    </div>
</main>
